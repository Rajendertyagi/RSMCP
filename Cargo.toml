[package]
name = "rsmcp"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/Rajendertyagi/RSMCP"
authors = ["Ali Hashemi", "Rajendertyagi"]
categories = ["command-line-interface", "command-line-utilities"]
description = "A comprehensive MCP server with filesystem, process management, PDF, Excel, and DOCX operations."
homepage = "https://github.com/Rajendertyagi/RSMCP"
keywords = [
    "rsmcp",
    "rust-mcp",
    "mcp-server",
    "filesystem",
    "pdf",
    "excel",
    "docx",
    "process-management",
]
license = "MIT"

exclude = ["tests/**/*"]

[package.metadata.wix]
upgrade-guid = "944FE3C9-C8C2-4114-8C8F-5330720E781F"
path-guid = "0BBAC013-2FD2-42B6-9815-D992FAD3F88E"
license = false
eula = false

[dependencies]
rust-mcp-sdk = {version="1.0", default-features = false, features = [
    "server",
    "macros",
    "stdio"
] }

thiserror = { version = "2.0" }
dirs = "6.0"
cap-std = "4"
ignore = "0.4"
similar = "=2.7"
chrono = "0.4"
clap = { version = "4.5", features = ["derive","env"] }
tokio = { version = "1.4", features = ["process", "rt-multi-thread", "sync"] }
serde = "1.0"
serde_json = "1.0"
async-trait = "0.1"
futures = "0.3"
tokio-util = "0.7"
zip = { version = "2", default-features = false, features = ["deflate", "lzma", "deflate64"] }
rc-zip = "5"
rc-zip-tokio = "4"
grep = "0.3"
base64 =  "0.22"
infer = "0.19.0"
rayon = "1.11.0"
sha2 = "0.10.9"
glob-match = "0.2"
blake3 = { version = "1.8", default-features = false }
crossbeam = "0.8"
strsim = "0.11"
pdf = "0.10"
calamine = "0.23"
rust_xlsxwriter = "0.80"
quick-xml = { version = "0.36", features = ["encoding"] }
regex = "1.10"
ignore = "0.4"

[dev-dependencies]
tempfile = "3.2"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[package.metadata.typos]
default.extend-ignore-re = ["4ded5ca"]
default.extend-ignore-identifiers = ["Rajendertyagi", "winfs", "mcpb", "calamine", "loxpdf"]
